<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber HUD Side Wings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-colour: #06b6d4;
            --primary-rgb: 6, 182, 212;
            --secondary-colour: #8b5cf6;
            --font-display: 'Rajdhani', sans-serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background-color: transparent !important;
            font-family: var(--font-sans);
            color: #f8fafc;
        }

        @keyframes livePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.18); opacity: 0.75; }
        }

        @keyframes eqBounce {
            0% { height: 18%; opacity: 0.55; }
            100% { height: 95%; opacity: 1; }
        }

        /* Side Wing HUD Panels */
        .privacy-wing-hud {
            position: absolute;
            pointer-events: none;
            z-index: 14;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 14px;
            overflow: hidden;
        }

        .wing-hud-card {
            background: rgba(10, 14, 28, 0.78);
            border: 1px solid rgba(var(--primary-rgb), 0.35);
            border-radius: 14px;
            padding: 14px 12px;
            box-shadow: inset 0 0 20px rgba(var(--primary-rgb), 0.12);
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .wing-hud-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(var(--primary-rgb), 0.18) 1px, transparent 1px);
            background-size: 14px 14px;
            pointer-events: none;
            opacity: 0.6;
        }

        .wing-tag {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--primary-colour);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wing-tag-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary-colour);
            box-shadow: 0 0 8px var(--primary-colour);
            animation: livePulse 1.8s infinite;
        }

        .wing-equaliser {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 5px;
            height: 90px;
            padding: 8px 4px;
        }

        .eq-bar {
            flex: 1;
            background: linear-gradient(180deg, var(--primary-colour), var(--secondary-colour));
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.5);
            animation: eqBounce 1.1s ease-in-out infinite alternate;
        }

        .wing-stat-block {
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }

        .wing-stat-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .wing-stat-val {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(var(--primary-rgb), 0.6);
        }
    </style>
</head>
<body>

    <!-- LEFT WING HUD PANEL -->
    <div class="privacy-wing-hud" id="hud-wing-left" style="display: flex; left: 12px; top: 145px; width: 286px; height: 535px;">
        <div class="wing-hud-card">
            <div class="wing-tag"><span class="wing-tag-dot"></span><span>SYS // L-WING</span></div>
            <div class="wing-equaliser">
                <div class="eq-bar" style="animation-delay: 0.0s;"></div>
                <div class="eq-bar" style="animation-delay: 0.2s;"></div>
                <div class="eq-bar" style="animation-delay: 0.4s;"></div>
                <div class="eq-bar" style="animation-delay: 0.1s;"></div>
                <div class="eq-bar" style="animation-delay: 0.3s;"></div>
                <div class="eq-bar" style="animation-delay: 0.5s;"></div>
            </div>
            <div class="wing-stat-block">
                <span class="wing-stat-label">Privacy Shield</span>
                <span class="wing-stat-val">AUTISM</span>
            </div>
        </div>
    </div>

    <!-- RIGHT WING HUD PANEL -->
    <div class="privacy-wing-hud" id="hud-wing-right" style="display: flex; left: 782px; top: 145px; width: 286px; height: 535px;">
        <div class="wing-hud-card">
            <div class="wing-tag"><span class="wing-tag-dot"></span><span>HUD // R-WING</span></div>
            <div class="wing-equaliser">
                <div class="eq-bar" style="animation-delay: 0.3s;"></div>
                <div class="eq-bar" style="animation-delay: 0.1s;"></div>
                <div class="eq-bar" style="animation-delay: 0.5s;"></div>
                <div class="eq-bar" style="animation-delay: 0.2s;"></div>
                <div class="eq-bar" style="animation-delay: 0.4s;"></div>
                <div class="eq-bar" style="animation-delay: 0.0s;"></div>
            </div>
            <div class="wing-stat-block">
                <span class="wing-stat-label">Audio Telemetry</span>
                <span class="wing-stat-val">ADHD</span>
            </div>
        </div>
    </div>

</body>
</html>
